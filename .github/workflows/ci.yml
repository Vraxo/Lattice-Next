name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & test (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build solution
        run: dotnet build Lattice.slnx --configuration Release

      - name: Test
        run: |
          set +e
          dotnet test Lattice.slnx --configuration Release --no-build > test-output.log 2>&1
          test_status=$?
          set -e
          cat test-output.log
          if [ "$test_status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          import re
          output = Path("test-output.log").read_text(errors="replace")
          output = re.sub(r"\x1b\[[0-9;]*m", "", output)
          failed_tests = [
              line.strip() for line in output.splitlines()
              if line.strip().lower().startswith("failed ") and ".tests." in line.lower()
          ]
          for failed_test in failed_tests:
              annotation = failed_test.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Failed test::{annotation}")
          print(f"::notice title=Test failure count::{len(failed_tests)} failed test case(s).")
          tail = "\n".join(output.splitlines()[-40:])
          if len(tail) > 12000:
              tail = tail[-12000:]
          message = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::notice title=Test failure details::{message}")
          PY
          fi
          exit "$test_status"

      - name: Report pipeline diagnostics
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          log = Path("test-output.log")
          if log.exists():
              lines = re.sub(r"\x1b\[[0-9;]*m", "", log.read_text(errors="replace")).splitlines()
              for index, line in enumerate(lines):
                  if "AaaDiagnosticsTests" not in line and not line.startswith("DIAG "):
                      continue
                  window = "\n".join(lines[index:index + 4])[:6000]
                  message = window.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::notice title=Diagnostic {index}::{message}")
          PY

      - name: Report failing test context
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          log = Path("test-output.log")
          if log.exists():
              lines = re.sub(r"\x1b\[[0-9;]*m", "", log.read_text(errors="replace")).splitlines()
              starts = [
                  index for index, line in enumerate(lines)
                  if line.strip().lower().startswith("failed ") and ".tests." in line.lower()
              ]
              emitted = 0
              last_end = -1
              for start in starts:
                  if start <= last_end or emitted >= 6:
                      continue
                  window = "\n".join(lines[start:start + 8])
                  last_end = start + 7
                  emitted += 1
                  message = window.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::notice title=Failing test {emitted}::{message}")
          PY

      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log
          if-no-files-found: ignore

      - name: Install web-search dependency
        run: python -m pip install -r tools/web-search/requirements.txt

      - name: Test external Python tools
        run: |
          python -m unittest discover -s tools/web-search -p "test_*.py"
          python -m unittest discover -s tools/web-page-fetch -p "test_*.py"
