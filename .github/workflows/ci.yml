name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & test (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build solution
        run: dotnet build Lattice.slnx --configuration Release

      - name: Test
        run: |
          set +e
          dotnet test Lattice.slnx --configuration Release --no-build > test-output.log 2>&1
          test_status=$?
          set -e
          cat test-output.log
          if [ "$test_status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          import re
          output = Path("test-output.log").read_text(errors="replace")
          output = re.sub(r"\x1b\[[0-9;]*m", "", output)
          failed_tests = [
              line.strip() for line in output.splitlines()
              if line.strip().lower().startswith("failed ") and ".tests." in line.lower()
          ]
          for failed_test in failed_tests:
              annotation = failed_test.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Failed test::{annotation}")
          print(f"::error title=Test failure count::{len(failed_tests)} failed test case(s).")
          tail = "\n".join(output.splitlines()[-40:])
          if len(tail) > 12000:
              tail = tail[-12000:]
          message = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::notice title=Test failure details::{message}")
          PY
          fi
          exit "$test_status"

      - name: Report test log windows
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          if Path("test-output.log").exists():
              text = Path("test-output.log").read_text(errors="replace")
              import re
              text = re.sub(r"\x1b\[[0-9;]*m", "", text)
              size = 11000
              windows = [text[i:i + size] for i in range(0, len(text), size)] if len(text) <= 4 * size else [text[i:i + size] for i in range(0, 4 * size, size)]
              for index, window in enumerate(windows):
                  message = window.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::notice title=Test log window {index + 1}::{message}")
          PY

      - name: Install web-search dependency
        run: python -m pip install -r tools/web-search/requirements.txt

      - name: Test external Python tools
        run: |
          python -m unittest discover -s tools/web-search -p "test_*.py"
          python -m unittest discover -s tools/web-page-fetch -p "test_*.py"
