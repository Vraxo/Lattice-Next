name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & test (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build solution
        run: dotnet build Lattice.slnx --configuration Release

      - name: Test
        run: |
          set +e
          dotnet test Lattice.slnx --configuration Release --no-build --logger "console;verbosity=normal" > test-output.log 2>&1
          test_status=$?
          set -e
          cat test-output.log
          if [ "$test_status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          output = Path("test-output.log").read_text(errors="replace")
          tail = "\n".join(output.splitlines()[-60:])
          if len(tail) > 20000:
              tail = tail[-20000:]
          message = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Test failure details::{message}")
          PY
          fi
          exit "$test_status"

      - name: Install web-search dependency
        run: python -m pip install -r tools/web-search/requirements.txt

      - name: Test external Python tools
        run: |
          python -m unittest discover -s tools/web-search -p "test_*.py"
          python -m unittest discover -s tools/web-page-fetch -p "test_*.py"
